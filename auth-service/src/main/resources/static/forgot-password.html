<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Sistema Bodega DSM</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-logos">
            <div class="logo logo-muni">Muni</div>
            <div class="logo logo-cesfam">CESFAM</div>
        </div>
        
        <h1 class="login-title">Recuperar Contraseña</h1>
        <p class="login-subtitle">Le enviaremos un enlace para restablecerla</p>
        
        <form id="formForgot" class="login-form" autocomplete="off" novalidate>
            <div class="form-group-login" id="group-id">
                <label for="identificador">RUT o Email</label>
                <div class="input-wrapper">
                    <input type="text" id="identificador" name="identificador"
                           placeholder="123456785 o usuario@dsm.cl"
                           autocomplete="username" required>
                    <span class="input-status" id="status-id"></span>
                </div>
                <div class="field-hint" id="hint-id"></div>
                <div class="field-help">
                    💡 Puede ingresar solo los números del RUT (el sistema lo formatea) o el email registrado
                </div>
            </div>
            
            <button type="submit" class="btn-login-primary" id="btnEnviar">
                <span class="btn-text">Enviar Instrucciones</span>
            </button>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="/login.html" class="forgot-password">← Volver al inicio de sesión</a>
            </div>
        </form>
        
        <div class="login-footer">
            <span>© 2026 Ilustre Municipalidad de Santa Cruz - DSM</span>
            <span class="version">v1.0</span>
        </div>
    </div>
</div>

<script src="/js/toast.js"></script>
<script src="/js/forgot-password.js"></script>
</body>
</html>
