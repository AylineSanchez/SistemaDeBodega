<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Sistema Bodega DSM</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-logos">
            <div class="logo logo-muni">Muni</div>
            <div class="logo logo-cesfam">CESFAM</div>
        </div>
        
        <h1 class="login-title">Nueva Contraseña</h1>
        <p class="login-subtitle">Ingrese su nueva contraseña segura</p>
        
        <form id="formReset" class="login-form" autocomplete="off" novalidate>
            <div class="form-group-login" id="group-pass">
                <label for="nuevaPassword">Nueva Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="nuevaPassword"
                           placeholder="Mínimo 8 caracteres"
                           autocomplete="new-password" required>
                    <button type="button" class="password-toggle"
                            onclick="togglePass('nuevaPassword')" tabindex="-1">👁️</button>
                </div>
                <div class="field-hint" id="hint-pass"></div>
            </div>
            
            <div class="form-group-login" id="group-confirm">
                <label for="confirmarPassword">Confirmar Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmarPassword"
                           placeholder="Repita la contraseña"
                           autocomplete="new-password" required>
                    <button type="button" class="password-toggle"
                            onclick="togglePass('confirmarPassword')" tabindex="-1">👁️</button>
                </div>
                <div class="field-hint" id="hint-confirm"></div>
            </div>
            
            <div class="password-rules" id="passwordRules">
                <div class="rule" data-rule="length">Mínimo 8 caracteres</div>
                <div class="rule" data-rule="upper">Al menos 1 mayúscula</div>
                <div class="rule" data-rule="number">Al menos 1 número</div>
                <div class="rule" data-rule="special">Al menos 1 carácter especial (!@#$%...)</div>
            </div>
            
            <button type="submit" class="btn-login-primary" id="btnReset">
                <span class="btn-text">Restablecer Contraseña</span>
            </button>
        </form>
        
        <div class="login-footer">
            <span>© 2026 Ilustre Municipalidad de Santa Cruz - DSM</span>
            <span class="version">v1.0</span>
        </div>
    </div>
</div>

<script src="/js/toast.js"></script>
<script src="/js/reset-password.js"></script>
</body>
</html>
