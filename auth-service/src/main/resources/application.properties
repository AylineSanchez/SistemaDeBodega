# ============================================================
# SERVIDOR
# ============================================================
server.port=8081
server.servlet.context-path=/

# ============================================================
# APLICACIÓN
# ============================================================
spring.application.name=auth-service

# ============================================================
# DATASOURCE POSTGRESQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/dsm_bodega
spring.datasource.username=dsm_admin
spring.datasource.password=dsm_password_2026
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================================
# RECURSOS ESTÁTICOS
# ============================================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# ============================================================
# SMTP GMAIL
# ============================================================
# Variables de entorno requeridas:
#   MAIL_USERNAME=sistemadegestiondebodega@gmail.com
#   MAIL_PASSWORD=tepaoubvbchpiufn
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.socketFactory.port=587
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# ============================================================
# APP - JWT
# ============================================================
app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1kc20tYm9kZWdhLTIwMjYtc2FudGEtY3J1ei1jaGlsZS1qd3Qtc2VjdXJlLWtleS1mb3ItYXV0aC1zZXJ2aWNl}
