# ============================================================
# APP - SEGURIDAD
# ============================================================
app.security.max-intentos-fallidos=3
app.security.inactividad-minutos=15

# ============================================================
# APP - MFA
# ============================================================
app.mfa.codigo-expiracion-segundos=300
app.mfa.longitud-codigo=6

# ============================================================
# APP - EMAIL
# ============================================================
app.email.from-email=${MAIL_USERNAME}
app.email.from-name=Sistema Bodega DSM Santa Cruz

# ============================================================
# APP - RESET DE CONTRASEÑA
# ============================================================
app.frontend.base-url=${FRONTEND_URL:http://localhost:8081}
app.password-reset.token-expiration-minutes=15
app.password-reset.max-solicitudes-por-hora=3

# ============================================================
# APP - CORS
# ============================================================
app.cors.allowed-origins=http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:5500

# ============================================================
# LOGGING
# ============================================================
logging.level.cl.dsm.auth=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n