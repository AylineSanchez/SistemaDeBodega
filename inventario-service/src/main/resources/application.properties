# ============================================================
# SERVIDOR
# ============================================================
server.port=8082
server.servlet.context-path=/

# ============================================================
# APLICACIÓN
# ============================================================
spring.application.name=inventario-service

# ============================================================
# DATASOURCE POSTGRESQL (misma BD que auth-service)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/dsm_bodega
spring.datasource.username=dsm_admin
spring.datasource.password=dsm_password_2026
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================================
# RECURSOS ESTÁTICOS
# ============================================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ============================================================
# MULTIPART (para subida de Excel en Fase 5)
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# JWT (MISMO SECRET que auth-service)
# ============================================================
app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1kc20tYm9kZWdhLTIwMjYtc2FudGEtY3J1ei1jaGlsZS1qd3Qtc2VjdXJlLWtleS1mb3ItYXV0aC1zZXJ2aWNl}

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083

# ============================================================
# LOGGING
# ============================================================
logging.level.cl.dsm.inventario=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

